name: Deploy Next.js to MilesWeb

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Export
        run: npm run build

      - name: Deploy to Server via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # Create a dedicated temporary directory for SSH config
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write the private key, remove Windows CRLF line endings, and ensure a trailing newline
          printenv SSH_PRIVATE_KEY | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add the server's host key to known_hosts to prevent MITM attacks and avoid prompt
          ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts
          # Deploy using tar over SSH instead of rsync
          # This safely streams the compressed contents of out/ to the server and extracts them.
          # Since it's additive (like copying), it naturally preserves .htaccess, php.ini, and other unrelated files on the server without deleting them.
          cd out && tar -czf - . | ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes $SSH_USER@$SSH_HOST "cd /home/anodzhiy/git.serviceproapp.in/ && tar -xzf -"
            
          # Clean up the SSH key
          rm -f ~/.ssh/id_rsa
